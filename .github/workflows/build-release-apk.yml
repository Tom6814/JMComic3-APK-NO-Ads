name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v2.0.30)'
        required: false
        default: 'v2.0.30'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip

      - name: Download Android SDK Command-line Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Package APK (unsigned)
        run: |
          rm -f app-unsigned.apk
          zip -D -0 app-unsigned.apk resources.arsc
          zip -D -0 app-unsigned.apk classes.dex
          zip -D app-unsigned.apk AndroidManifest.xml DebugProbesKt.bin
          zip -r -D -n ".png:.jpg:.jpeg:.gif:.webp:.mp3:.mp4:.ogg:.dex" app-unsigned.apk \
            assets/ kotlin/ META-INF/ org/ res/ \
            -x "*.DS_Store" \
            -x "__MACOSX/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "*.apk" \
            -x "*.keystore" \
            -x "*.py"
          echo "Unsigned APK size: $(du -h app-unsigned.apk | cut -f1)"

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=JMComic3, OU=Dev, O=JMComic3, L=CN" \
            -noprompt

      - name: Zipalign & Sign APK
        run: |
          SDK_ROOT="$HOME/android-sdk"
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_ROOT "build-tools;34.0.0"
          ZIPALIGN="$SDK_ROOT/build-tools/34.0.0/zipalign"
          APKSIGNER="$SDK_ROOT/build-tools/34.0.0/apksigner"
          "$ZIPALIGN" -v -p 4 app-unsigned.apk app-aligned.apk
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release.apk \
            app-aligned.apk
          echo "Signed APK size: $(du -h app-release.apk | cut -f1)"
          "$APKSIGNER" verify --verbose app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JMComic3-v2.0.30-NoAds
          path: app-release.apk
