name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v2.0.29)'
        required: false
        default: 'v2.0.29'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip

      - name: Download Android SDK Command-line Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Prepare APK contents
        run: |
          # Remove old signature files (keep other META-INF files like AndroidX versions)
          rm -f META-INF/CERT.RSA
          rm -f META-INF/CERT.SF
          rm -f META-INF/MANIFEST.MF

      - name: Package APK (unsigned)
        run: |
          rm -f app-unsigned.apk
          
          # Step 1: resources.arsc MUST be stored uncompressed for Android to parse it
          zip -D -0 app-unsigned.apk resources.arsc
          
          # Step 2: classes.dex also stored uncompressed
          zip -D -0 app-unsigned.apk classes.dex
          
          # Step 3: Add AndroidManifest.xml and other root files
          zip -D app-unsigned.apk AndroidManifest.xml DebugProbesKt.bin
          
          # Step 4: Add directories with compression, exclude git/unnecessary files
          # -D : don't create explicit directory entries (required for valid APK)
          # -n : don't try to compress already-compressed files (PNG, JPG, etc.)
          zip -r -D -n ".png:.jpg:.jpeg:.gif:.webp:.mp3:.mp4:.ogg:.dex" app-unsigned.apk \
            assets/ kotlin/ META-INF/ org/ res/ \
            -x "*.DS_Store" \
            -x "__MACOSX/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "*.apk" \
            -x "*.keystore"
          
          echo "Unsigned APK size: $(du -h app-unsigned.apk | cut -f1)"
          
          # Verify APK structure
          echo ""
          echo "=== APK Contents (first 50 entries) ==="
          unzip -l app-unsigned.apk | head -55

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=JMComic3, OU=Dev, O=JMComic3, L=Unknown, ST=Unknown, C=CN" \
            -noprompt

      - name: Zipalign APK
        run: |
          ZIPALIGN="$HOME/android-sdk/cmdline-tools/latest/bin/zipalign"
          if [ ! -f "$ZIPALIGN" ]; then
            # zipalign might be in build-tools, try to find it
            ZIPALIGN=$(find $HOME/android-sdk -name zipalign -type f 2>/dev/null | head -1)
          fi
          if [ -z "$ZIPALIGN" ]; then
            echo "zipalign not found, using sdkmanager to install build-tools"
            yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "build-tools;34.0.0"
            ZIPALIGN="$HOME/android-sdk/build-tools/34.0.0/zipalign"
          fi
          "$ZIPALIGN" -v -p 4 app-unsigned.apk app-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER="$HOME/android-sdk/build-tools/34.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            APKSIGNER=$(find $HOME/android-sdk -name apksigner -type f 2>/dev/null | head -1)
          fi
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release.apk \
            app-aligned.apk
          
          echo "Signed APK size: $(du -h app-release.apk | cut -f1)"
          
          # Verify the signed APK
          echo ""
          echo "=== Verifying APK signature ==="
          "$APKSIGNER" verify --verbose app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JMComic3-v2.0.29-NoAds
          path: app-release.apk
